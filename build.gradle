plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.3.0-neoforge.1'
group = 'io.github.achilleus1'
base { archivesName = 'neo-thundering-immersed-1.21.1' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
neoForge {
    version = '21.1.255'
    runs { client { client() } }
    mods { immersivethunder { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
jar {
    manifest.attributes('Implementation-Title': 'Neo Thundering Immersed',
        'Implementation-Version': project.version,
        'Built-On-Minecraft': '1.21.1')
}
